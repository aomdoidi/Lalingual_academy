/* ============ Language switcher ============ */
function setLang(lang) {
  const dict = i18n[lang] || i18n.th;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const val = dict[el.dataset.i18n];
    if (val === undefined) return;
    // ข้อความเป็นของเราเองทั้งหมด จึงใช้ innerHTML ได้อย่างปลอดภัย
    el.innerHTML = val;
  });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  try { localStorage.setItem('lang', lang); } catch (e) {}
}
document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

let saved = 'th';
try { saved = localStorage.getItem('lang') || 'th'; } catch (e) {}
setLang(saved);

/* ============ Mobile menu ============ */
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('mobileNav').classList.toggle('hidden');
});
document.querySelectorAll('#mobileNav a').forEach(a => a.addEventListener('click', () => {
  document.getElementById('mobileNav').classList.add('hidden');
}));

document.getElementById('year').textContent = new Date().getFullYear();
